<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lin的笔记</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="vendor/vditor/dist/index.css">
<style>
/* ── Reset ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Root ───────────────────────────────────────────────────────────────── */
:root {
  --pri:   #5a67d8;
  --pri2:  #9f7aea;
  --bg:    #f0f2f7;
  --white: #ffffff;
  --text:  #2d3748;
  --sub:   #718096;
  --bdr:   #e2e8f0;
  --card:  #ffffff;
  --nav-h: 56px;
}

html, body {
  height: 100%;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

/* ── Top Nav ─────────────────────────────────────────────────────────────── */
.top-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: var(--white);
  border-bottom: 1px solid var(--bdr);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 8px;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.top-nav .brand {
  font-weight: 700;
  font-size: 1.1rem;
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-right: 24px;
  white-space: nowrap;
}

.top-nav .spacer { margin-left: auto; }
.account-box {
  display: flex;
  align-items: center;
  gap: 8px;
}
#auth-user-label {
  color: var(--sub);
  font-size: 0.82rem;
  white-space: nowrap;
}

/* ── Page wrapper ───────────────────────────────────────────────────────── */
.page {
  display: none;
  min-height: 100vh;
}
.page.active { display: block; }

/* ── Shared form elements ───────────────────────────────────────────────── */
select, input[type="text"], input[type="password"] {
  padding: 7px 10px;
  border: 1.5px solid var(--bdr);
  border-radius: 8px;
  font-size: 0.88rem;
  color: var(--text);
  background: var(--white);
  outline: none;
  transition: border-color 0.18s;
}
select:focus, input[type="text"]:focus, input[type="password"]:focus { border-color: var(--pri); }

textarea {
  border: 1.5px solid var(--bdr);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: 'Fira Code', 'Courier New', monospace;
  font-size: 0.87rem;
  line-height: 1.65;
  outline: none;
  background: #f7fafc;
  color: var(--text);
  transition: border-color 0.18s, background 0.18s;
  resize: vertical;
}
textarea:focus { border-color: var(--pri); background: var(--white); }
textarea::placeholder { color: #c0cfe0; }

button {
  cursor: pointer;
  border: none;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 500;
  transition: all 0.18s;
}

.btn-primary {
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  color: white;
  padding: 8px 20px;
  box-shadow: 0 2px 8px rgba(90,103,216,0.3);
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

.btn-ghost {
  background: #eef0fd;
  color: var(--pri);
  padding: 7px 14px;
  border: 1.5px solid #c3cbf7;
}
.btn-ghost:hover { background: #e0e4f9; }

.btn-danger {
  background: #fff5f5;
  color: #e53e3e;
  padding: 7px 14px;
  border: 1.5px solid #fed7d7;
}
.btn-danger:hover { background: #fed7d7; }

.render-box {
  background: var(--white);
  border: 1px solid var(--bdr);
  border-radius: 12px;
  padding: 16px 20px;
  min-height: 80px;
  line-height: 1.9;
  font-size: 0.95rem;
  overflow-x: auto;
  word-break: break-word;
}
.render-box .katex-display { margin: 8px 0; overflow-x: auto; }
.render-box img { max-width: 100%; border-radius: 8px; margin: 8px 0; }
.render-box pre {
  background: #f7fafc;
  border: 1px solid var(--bdr);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
  font-family: 'Fira Code', 'Courier New', monospace;
  font-size: 0.85rem;
}
.render-box code {
  background: #edf2f7;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Fira Code', 'Courier New', monospace;
  color: #553c9a;
  font-size: 0.88rem;
}
.render-box pre code { background: none; padding: 0; }
.render-box h1, .render-box h2, .render-box h3, .render-box h4 {
  margin-top: 16px; margin-bottom: 8px; font-weight: 600;
}
.render-box h1 { font-size: 1.4rem; }
.render-box h2 { font-size: 1.2rem; }
.render-box h3 { font-size: 1.05rem; }
.render-box ul, .render-box ol { padding-left: 24px; margin: 6px 0; }
.render-box blockquote {
  border-left: 3px solid var(--pri);
  padding-left: 12px;
  color: var(--sub);
  margin: 8px 0;
}
.render-box table { border-collapse: collapse; margin: 8px 0; width: 100%; }
.render-box th, .render-box td {
  border: 1px solid var(--bdr);
  padding: 6px 10px;
  text-align: left;
  font-size: 0.88rem;
}
.render-box th { background: #f7fafc; font-weight: 600; }
.md-scroll-anchor {
  display: block;
  height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: hidden;
  pointer-events: none;
}

.section-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--sub);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}

.msg-ok  { color: #38a169; font-size: 0.82rem; margin-top: 6px; }
.msg-err { color: #e53e3e; font-size: 0.82rem; margin-top: 6px; }

.empty-hint {
  color: var(--sub);
  font-size: 0.85rem;
  text-align: center;
  padding: 40px 0;
}

/* ── Auth overlay / modal ──────────────────────────────────────────────── */
.auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(240,242,247,0.92);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.auth-card {
  width: 100%;
  max-width: 420px;
  background: var(--white);
  border: 1px solid var(--bdr);
  border-radius: 16px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.12);
  padding: 28px;
}
.auth-card h3 {
  font-size: 1.15rem;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.auth-card p {
  color: var(--sub);
  font-size: 0.82rem;
  margin-bottom: 16px;
}
.auth-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}
.auth-row label {
  color: var(--sub);
  font-size: 0.8rem;
}
.auth-row input { width: 100%; }
.auth-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.auth-actions .btn-primary { flex: 1; }

/* ── Note List View ────────────────────────────────────────────────────── */
#view-list {
  padding: calc(var(--nav-h) + 28px) 24px 28px;
  max-width: 960px;
  margin: 0 auto;
}

.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.list-header h2 { font-size: 1.25rem; font-weight: 700; }

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 12px;
}
.filter-bar select { min-width: 130px; }

.note-card {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 12px;
  transition: box-shadow 0.18s, border-color 0.18s;
  cursor: pointer;
}
.note-card:hover {
  border-color: #c3cbf7;
  box-shadow: 0 4px 16px rgba(90,103,216,0.1);
}
.note-card-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.6;
}
.note-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  font-size: 0.78rem;
  color: var(--sub);
}

.badge-topic {
  background: #eef0fd;
  color: var(--pri);
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-tag {
  background: #f0fdf4;
  color: #38a169;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
}
.stars-display {
  color: #ecc94b;
  font-size: 0.85rem;
  letter-spacing: 1px;
}
.stars-display .empty-star { color: #e2e8f0; }

/* ── Note Form View ────────────────────────────────────────────────────── */
#view-form {
  padding: calc(var(--nav-h) + 28px) 24px 28px;
  max-width: 1200px;
  margin: 0 auto;
}

.form-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.form-header h2 { font-size: 1.15rem; font-weight: 700; }

.form-row {
  margin-bottom: 20px;
}
.form-row > .section-label { margin-bottom: 8px; }

.form-row input[type="text"].full-width {
  width: 100%;
}
.title-preview-box {
  margin-top: 10px;
  min-height: 48px;
  padding: 10px 12px;
  font-size: 0.92rem;
  line-height: 1.8;
}

.topic-selector {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: stretch;
}
.topic-levels {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.topic-levels select { min-width: 180px; }
.topic-new-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.topic-new-row input[type="text"] { flex: 1; min-width: 260px; }
.topic-new-row button { white-space: nowrap; }
.topic-hint {
  color: var(--sub);
  font-size: 0.8rem;
  line-height: 1.5;
}

/* ── Tag Multi-select ──────────────────────────────────────────────────── */
.tag-selector {
  position: relative;
  max-width: 500px;
}
.tag-selector-input {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 6px 8px;
  border: 1.5px solid var(--bdr);
  border-radius: 8px;
  min-height: 36px;
  cursor: text;
  background: var(--white);
  transition: border-color 0.18s;
  align-items: center;
}
.tag-selector-input.focused { border-color: var(--pri); }
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #f0fdf4;
  color: #38a169;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.78rem;
  white-space: nowrap;
}
.tag-chip-remove {
  cursor: pointer;
  color: #68d391;
  font-weight: 700;
  font-size: 0.85rem;
  line-height: 1;
}
.tag-chip-remove:hover { color: #e53e3e; }
.tag-input-inner {
  border: none;
  outline: none;
  font-size: 0.85rem;
  min-width: 80px;
  flex: 1;
  padding: 2px 4px;
  background: transparent;
  color: var(--text);
}
.tag-input-inner::placeholder { color: #c0cfe0; }
.tag-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--white);
  border: 1px solid var(--bdr);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  max-height: 200px;
  overflow-y: auto;
  z-index: 50;
  display: none;
  margin-top: 4px;
}
.tag-dropdown.open { display: block; }
.tag-option {
  padding: 7px 12px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.12s;
}
.tag-option:hover { background: #eef0fd; color: var(--pri); }
.tag-option.add-new {
  color: var(--pri);
  font-weight: 500;
  border-top: 1px solid var(--bdr);
}

/* ── Star Rating ───────────────────────────────────────────────────────── */
.stars-input {
  display: inline-flex;
  gap: 4px;
}
.star-btn {
  background: none;
  border: none;
  padding: 2px;
  font-size: 1.3rem;
  color: #e2e8f0;
  cursor: pointer;
  transition: color 0.12s, transform 0.12s;
  line-height: 1;
}
.star-btn.filled { color: #ecc94b; }
.star-btn:hover { color: #d69e2e; transform: scale(1.15); }

/* ── Markdown Split Editor ─────────────────────────────────────────────── */
.editor-toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}
.editor-toolbar button {
  background: #edf2f7;
  color: var(--sub);
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 0.82rem;
}
.editor-toolbar button:hover { background: #e2e8f0; color: var(--text); }
.editor-toolbar .hint {
  color: var(--sub);
  font-size: 0.78rem;
  margin-left: auto;
}

.vditor-shell { display: none; }
.vditor-shell.active { display: block; }
.vditor-shell .vditor {
  border: 1px solid var(--bdr);
  border-radius: 12px;
  overflow: hidden;
}
.vditor-shell .vditor-reset {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
.editor-split.vditor-fallback-hidden { display: none; }

.editor-split {
  --editor-left-width: calc(50% - 5px);
  display: grid;
  grid-template-columns:
    minmax(0, var(--editor-left-width))
    10px
    minmax(0, calc(100% - var(--editor-left-width) - 10px));
  gap: 0;
  align-items: stretch;
}
@media (max-width: 800px) {
  .editor-split { grid-template-columns: 1fr; gap: 16px; }
  .editor-resizer { display: none; }
}

.editor-col { display: flex; flex-direction: column; min-width: 0; }
.editor-col .section-label { margin-bottom: 6px; }

.editor-resizer {
  position: relative;
  cursor: col-resize;
  user-select: none;
  touch-action: none;
}
.editor-resizer::before {
  content: '';
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 50%;
  width: 2px;
  transform: translateX(-50%);
  background: var(--bdr);
  border-radius: 999px;
  transition: background-color 0.18s;
}
.editor-resizer:hover::before,
.editor-resizer.active::before {
  background: var(--pri);
}

#note-editor-md {
  width: 100%;
  min-height: 400px;
  height: 400px;
  flex: 1;
  resize: none;
  overflow-y: auto;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 0.95rem;
  line-height: 1.9;
  background: var(--white);
}

#note-preview {
  min-height: 400px;
  height: 400px;
  flex: 1;
  overflow-y: auto;
}

.form-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--bdr);
}

/* ── Note Detail View ──────────────────────────────────────────────────── */
#view-detail {
  padding: calc(var(--nav-h) + 28px) 24px 28px;
  max-width: 900px;
  margin: 0 auto;
}

.detail-header {
  margin-bottom: 20px;
}
.detail-back {
  margin-bottom: 16px;
}
.detail-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 12px;
  line-height: 1.6;
}
.detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  font-size: 0.8rem;
  color: var(--sub);
  margin-bottom: 16px;
}
.detail-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.detail-body {
  min-height: 200px;
}

/* ── Comments & Questions ──────────────────────────────────────────────── */
.cq-section {
  margin-top: 28px;
}
.cq-section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.cq-section-header h3 {
  font-size: 1rem;
  font-weight: 700;
}
.cq-add-btn {
  background: #eef0fd;
  color: var(--pri);
  padding: 5px 14px;
  border-radius: 8px;
  font-size: 0.82rem;
  border: 1.5px solid #c3cbf7;
}
.cq-add-btn:hover { background: #e0e4f9; }

.cq-item {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 10px;
}
.cq-item.is-reply {
  margin-left: 32px;
  border-left: 3px solid #c3cbf7;
}
.cq-item-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 0.78rem;
  color: var(--sub);
}
.cq-icon {
  font-size: 1rem;
  line-height: 1;
}
.cq-icon.question { color: #d97706; }
.cq-icon.resolved { color: #38a169; }
.cq-item-body {
  line-height: 1.8;
  font-size: 0.92rem;
  word-break: break-word;
}
.cq-item-body .katex-display { margin: 6px 0; }
.cq-item-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.cq-item-actions button {
  font-size: 0.78rem;
  padding: 3px 10px;
  border-radius: 6px;
  background: #f7fafc;
  color: var(--sub);
  border: 1px solid var(--bdr);
}
.cq-item-actions button:hover { background: #edf2f7; color: var(--text); }
.cq-item-actions .btn-resolve {
  color: #38a169;
  border-color: #c6f6d5;
}
.cq-item-actions .btn-resolve:hover { background: #f0fff4; }
.cq-item-actions .btn-unresolve {
  color: #d97706;
  border-color: #fefcbf;
}
.cq-item-actions .btn-unresolve:hover { background: #fffff0; }
.cq-item-actions .btn-delete-cq {
  color: #e53e3e;
  border-color: #fed7d7;
}
.cq-item-actions .btn-delete-cq:hover {
  background: #fff5f5;
  color: #c53030;
}

/* ── Inline KaTeX input box (for comment/question) ─────────────────────── */
.cq-input-box {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 12px;
}
.cq-input-box.is-reply {
  margin-left: 32px;
}
.cq-input-box textarea {
  width: 100%;
  min-height: 70px;
  resize: vertical;
}
.cq-input-box .cq-input-preview {
  margin-top: 8px;
  padding: 8px 12px;
  background: #f7fafc;
  border: 1px solid var(--bdr);
  border-radius: 8px;
  min-height: 36px;
  line-height: 1.8;
  font-size: 0.92rem;
  word-break: break-word;
}
.cq-input-box .cq-input-preview .katex-display { margin: 4px 0; }
.cq-input-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.cq-input-actions .btn-submit {
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  color: white;
  padding: 5px 16px;
  font-size: 0.82rem;
}
.cq-input-actions .btn-cancel {
  background: #edf2f7;
  color: var(--sub);
  padding: 5px 16px;
  font-size: 0.82rem;
}

/* ── Floating KaTeX preview ─────────────────────────────────────────────── */
#float-preview {
  position: fixed;
  display: none;
  z-index: 9999;
  width: 420px;
  max-width: calc(100vw - 24px);
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid rgba(90,103,216,0.2);
}
#fp-header {
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  color: white;
  padding: 8px 14px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 7px;
}
#fp-body {
  padding: 12px 16px;
  max-height: 260px;
  overflow-y: auto;
  font-size: 0.95rem;
  line-height: 2;
  word-break: break-word;
}
#fp-body .katex-display { margin: 6px 0; overflow-x: auto; }
</style>
</head>
<body>

<!-- ── Top Navigation ──────────────────────────────────────────────────── -->
<nav class="top-nav">
  <span class="brand">Lin的笔记</span>
  <span class="spacer"></span>
  <div class="account-box">
    <span id="auth-user-label">未登录</span>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════════
   Constants & State
   ════════════════════════════════════════════════════════════════════════ */
const KATEX_OPTS = {
  delimiters: [
    { left: '$$',  right: '$$',  display: true  },
    { left: '$',   right: '$',   display: false },
    { left: '\\[', right: '\\]', display: true  },
    { left: '\\(', right: '\\)', display: false },
  ],
  throwOnError: false,
  errorColor: '#e53e3e',
};

const AUTH_KEY = 'lin-notes-auth';
let authState = { token: '', username: '' };

let allNotes = [];
let allTopics = [];
let allTags = [];
let currentView = 'list';
let editingNoteId = null;
let viewingNoteId = null;
let selectedTags = [];
let currentPriority = 0;
let noteVditor = null;
let noteVditorInitStarted = false;
let noteVditorPendingValue = '';
const TOPIC_NEW_MARKER = '__new__';
let topicFormState = {
  segments: [],
  pendingNewDepth: null,
};

/* ════════════════════════════════════════════════════════════════════════
   Utilities
   ════════════════════════════════════════════════════════════════════════ */
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toggleNoteEditorMode(useVditor) {
  const shell = $('note-editor-vditor-shell');
  const fallback = $('editor-split');
  if (shell) shell.classList.toggle('active', !!useVditor);
  if (fallback) fallback.classList.toggle('vditor-fallback-hidden', !!useVditor);
}

function syncHiddenNoteEditorValueFromVditor() {
  if (!noteVditor || typeof noteVditor.getValue !== 'function') return;
  try {
    $('note-editor-md').value = noteVditor.getValue();
  } catch (e) {}
}

function getNoteEditorValue() {
  if (noteVditor && typeof noteVditor.getValue === 'function') {
    try { return noteVditor.getValue(); } catch (e) {}
  }
  return $('note-editor-md').value;
}

function setNoteEditorValue(value) {
  const text = String(value || '');
  const ta = $('note-editor-md');
  ta.value = text;
  noteVditorPendingValue = text;

  if (noteVditor && typeof noteVditor.setValue === 'function') {
    try {
      noteVditor.setValue(text);
      syncHiddenNoteEditorValueFromVditor();
      return;
    } catch (e) {}
  }

  renderMarkdownKatex(text, $('note-preview'), { withScrollAnchors: true });
}

function focusNoteEditor() {
  if (noteVditor && typeof noteVditor.focus === 'function') {
    try { noteVditor.focus(); return; } catch (e) {}
  }
  $('note-editor-md').focus();
}

function insertMarkdownToNoteEditor(md) {
  if (noteVditor && typeof noteVditor.insertValue === 'function') {
    try {
      noteVditor.insertValue(md);
      syncHiddenNoteEditorValueFromVditor();
      return true;
    } catch (e) {}
  }
  return false;
}

function ensureNoteVditor() {
  if (noteVditor) {
    toggleNoteEditorMode(true);
    if (typeof noteVditor.resize === 'function') {
      setTimeout(() => { try { noteVditor.resize(); } catch (e) {} }, 0);
    }
    return;
  }
  if (noteVditorInitStarted) return;
  if (typeof window.Vditor !== 'function') {
    toggleNoteEditorMode(false);
    return;
  }

  noteVditorInitStarted = true;
  try {
    noteVditor = new Vditor('note-editor-vditor', {
      mode: 'wysiwyg',
      height: 400,
      cdn: '/vendor/vditor',
      cache: { enable: false },
      preview: {
        math: { engine: 'KaTeX' },
      },
      input(value) {
        $('note-editor-md').value = value;
      },
      after() {
        toggleNoteEditorMode(true);
        try {
          noteVditor.setValue(noteVditorPendingValue || $('note-editor-md').value || '');
          syncHiddenNoteEditorValueFromVditor();
          if (currentView === 'form' && typeof noteVditor.resize === 'function') {
            noteVditor.resize();
          }
        } catch (e) {}
      },
    });
  } catch (e) {
    noteVditor = null;
    noteVditorInitStarted = false;
    toggleNoteEditorMode(false);
    console.error('Vditor 初始化失败:', e);
  }
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'Z');
  return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function showMsg(elId, text, type) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = type === 'ok' ? 'msg-ok' : 'msg-err';
  setTimeout(() => { el.textContent = ''; el.className = ''; }, 2500);
}

function $(id) { return document.getElementById(id); }

function splitTopicPath(raw) {
  return String(raw || '')
    .split('/')
    .map(s => s.trim())
    .filter(Boolean);
}

function joinTopicPath(segments) {
  return (segments || []).map(s => String(s || '').trim()).filter(Boolean).join(' / ');
}

function formatTopicLabel(raw) {
  const parts = splitTopicPath(raw);
  return parts.length ? joinTopicPath(parts) : String(raw || '').trim();
}

function buildTopicIndex() {
  const childrenByPrefix = new Map();
  const pathRawByNorm = new Map();

  function addChild(prefix, child) {
    if (!childrenByPrefix.has(prefix)) childrenByPrefix.set(prefix, new Set());
    childrenByPrefix.get(prefix).add(child);
  }

  (allTopics || []).forEach(t => {
    const raw = String((t && t.name) || '').trim();
    const parts = splitTopicPath(raw);
    if (!parts.length) return;
    const norm = joinTopicPath(parts);
    if (!pathRawByNorm.has(norm)) pathRawByNorm.set(norm, raw);
    for (let i = 0; i < parts.length; i++) {
      const prefix = joinTopicPath(parts.slice(0, i));
      addChild(prefix, parts[i]);
    }
  });

  return { childrenByPrefix, pathRawByNorm };
}

function getTopicChildren(index, prefixSegments) {
  const key = joinTopicPath(prefixSegments);
  return Array.from(index.childrenByPrefix.get(key) || []).sort((a, b) => a.localeCompare(b, 'zh-CN'));
}

function resetTopicFormState() {
  topicFormState = { segments: [], pendingNewDepth: null };
  $('new-topic-input').value = '';
  renderTopicFormSelector();
}

function setTopicFormByRawTopic(rawTopic) {
  topicFormState = {
    segments: splitTopicPath(rawTopic),
    pendingNewDepth: null,
  };
  $('new-topic-input').value = '';
  renderTopicFormSelector();
}

function updateTopicCurrentHint() {
  const hint = $('topic-current-hint');
  const topic = getTopicValueFromForm({ preview: true });
  hint.textContent = '当前主题：' + (topic ? formatTopicLabel(topic) : '未选择');
}

function getPendingTopicInputParts() {
  return splitTopicPath($('new-topic-input').value);
}

function commitPendingTopicToSegments() {
  const pendingNewDepth = topicFormState.pendingNewDepth;
  if (pendingNewDepth == null) return false;

  const baseSegments = (topicFormState.segments || []).slice(0, pendingNewDepth);
  const suffixParts = getPendingTopicInputParts();
  if (!suffixParts.length) return false;

  topicFormState = {
    segments: baseSegments.concat(suffixParts),
    pendingNewDepth: null,
  };
  $('new-topic-input').value = '';
  renderTopicFormSelector();
  return true;
}

function renderTopicFormSelector() {
  const container = $('topic-levels');
  if (!container) return;

  const index = buildTopicIndex();
  const segments = topicFormState.segments || [];
  const pendingNewDepth = topicFormState.pendingNewDepth;
  const lastDepth = Math.max(segments.length, pendingNewDepth == null ? -1 : pendingNewDepth);
  container.innerHTML = '';

  for (let depth = 0; depth <= Math.max(0, lastDepth); depth++) {
    if (depth > 0 && segments.length < depth) break;
    const prefix = segments.slice(0, depth);
    const children = getTopicChildren(index, prefix);
    const select = document.createElement('select');
    select.dataset.topicDepth = String(depth);

    const currentVal = pendingNewDepth === depth
      ? TOPIC_NEW_MARKER
      : (depth < segments.length ? segments[depth] : '');

    let firstLabel = '选择主题...';
    if (depth > 0) firstLabel = '停在当前级（' + prefix[prefix.length - 1] + '）';
    select.innerHTML = '<option value="">' + escapeHtml(firstLabel) + '</option>';

    const optionValues = new Set(children);
    if (currentVal && currentVal !== TOPIC_NEW_MARKER && !optionValues.has(currentVal)) {
      optionValues.add(currentVal);
      children.push(currentVal);
      children.sort((a, b) => a.localeCompare(b, 'zh-CN'));
    }

    children.forEach(name => {
      select.innerHTML += '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
    });

    const newLabel = depth === 0 ? '+ 新建主题（支持多级）' : '+ 在当前级下新建主题';
    select.innerHTML += '<option value="' + TOPIC_NEW_MARKER + '">' + escapeHtml(newLabel) + '</option>';
    select.value = currentVal;
    container.appendChild(select);
  }

  const newRow = $('topic-new-row');
  const newInput = $('new-topic-input');
  if (pendingNewDepth != null) {
    const parentSegments = segments.slice(0, pendingNewDepth);
    const parentText = joinTopicPath(parentSegments);
    newRow.style.display = '';
    newInput.placeholder = parentText
      ? ('在 "' + parentText + '" 下输入新主题，支持多级（如 群论/表示论）')
      : '输入新主题名称，支持多级（如 数学/代数）';
    $('btn-topic-commit-level').disabled = getPendingTopicInputParts().length === 0;
  } else {
    newRow.style.display = 'none';
    $('btn-topic-commit-level').disabled = true;
  }

  updateTopicCurrentHint();
}

function handleTopicLevelChange(depth, value) {
  const oldSegments = topicFormState.segments.slice();
  const nextSegments = oldSegments.slice(0, depth);

  if (!value) {
    topicFormState = { segments: nextSegments, pendingNewDepth: null };
    $('new-topic-input').value = '';
    renderTopicFormSelector();
    return;
  }

  if (value === TOPIC_NEW_MARKER) {
    topicFormState = { segments: nextSegments, pendingNewDepth: depth };
    renderTopicFormSelector();
    return;
  }

  nextSegments.push(value);
  topicFormState = { segments: nextSegments, pendingNewDepth: null };
  $('new-topic-input').value = '';
  renderTopicFormSelector();
}

function getTopicValueFromForm(opts = {}) {
  const preview = !!opts.preview;
  const segments = (topicFormState.segments || []).slice();
  const pendingNewDepth = topicFormState.pendingNewDepth;

  if (pendingNewDepth != null) {
    const parentSegments = segments.slice(0, pendingNewDepth);
    const suffixParts = splitTopicPath($('new-topic-input').value);
    if (!suffixParts.length) {
      if (preview) return joinTopicPath(parentSegments);
      return '';
    }
    const fullParts = parentSegments.concat(suffixParts);
    const norm = joinTopicPath(fullParts);
    const index = buildTopicIndex();
    return index.pathRawByNorm.get(norm) || norm;
  }

  if (!segments.length) return '';
  const norm = joinTopicPath(segments);
  const index = buildTopicIndex();
  return index.pathRawByNorm.get(norm) || norm;
}

/* ════════════════════════════════════════════════════════════════════════
   Auth System
   ════════════════════════════════════════════════════════════════════════ */
function loadAuthState() {
  try {
    const s = localStorage.getItem(AUTH_KEY);
    if (s) authState = JSON.parse(s);
  } catch(e) {}
}

function persistAuthState() {
  localStorage.setItem(AUTH_KEY, JSON.stringify(authState));
}

function clearAuthState() {
  authState = { token: '', username: '' };
  localStorage.removeItem(AUTH_KEY);
  setLoggedInUI(false);
}

function setLoggedInUI(loggedIn) {
  $('auth-overlay').style.display = loggedIn ? 'none' : 'flex';
  $('btn-logout').style.display = loggedIn ? '' : 'none';
  $('auth-user-label').textContent = loggedIn ? authState.username : '未登录';
}

async function apiFetch(url, opts = {}) {
  if (authState.token) {
    opts.headers = opts.headers || {};
    if (!(opts.body instanceof FormData)) {
      // Don't set Content-Type for FormData (browser sets boundary)
    }
    opts.headers['Authorization'] = 'Bearer ' + authState.token;
  }
  const res = await fetch(url, opts);
  if (res.status === 401) {
    clearAuthState();
  }
  return res;
}

async function doLogin() {
  const username = $('login-username').value.trim();
  const password = $('login-password').value;
  if (!username || !password) {
    showMsg('login-msg', '请输入用户名和密码', 'err');
    return;
  }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg('login-msg', data.error || '登录失败', 'err');
      return;
    }
    authState.token = data.token;
    authState.username = data.username;
    persistAuthState();
    setLoggedInUI(true);
    loadAllData();
  } catch(e) {
    showMsg('login-msg', '网络错误', 'err');
  }
}

async function restoreSession() {
  loadAuthState();
  if (!authState.token) {
    setLoggedInUI(false);
    return;
  }
  try {
    const res = await apiFetch('/api/auth/me');
    if (res.ok) {
      setLoggedInUI(true);
      loadAllData();
    } else {
      clearAuthState();
    }
  } catch(e) {
    clearAuthState();
  }
}

/* ════════════════════════════════════════════════════════════════════════
   View Navigation
   ════════════════════════════════════════════════════════════════════════ */
function showView(name) {
  currentView = name;
  $('view-list').classList.toggle('active', name === 'list');
  $('view-form').classList.toggle('active', name === 'form');
  $('view-detail').classList.toggle('active', name === 'detail');
  if (name === 'form') ensureNoteVditor();
  window.scrollTo(0, 0);
}

/* ════════════════════════════════════════════════════════════════════════
   KaTeX + Markdown Rendering
   ════════════════════════════════════════════════════════════════════════ */
const _mathRe = /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\$(?!\s)(?:[^\$\n]|\\.)+?\$|\\\([\s\S]*?\\\))/g;
const SCROLL_ANCHOR_CLASS = 'md-scroll-anchor';

function countNewlines(s) {
  return (String(s || '').match(/\n/g) || []).length;
}

function annotateMarkedTokenLines(tokens, startLine = 1) {
  let line = startLine;
  if (!Array.isArray(tokens)) return line;

  for (const token of tokens) {
    token._lineStart = line;

    if (token.type === 'blockquote' && Array.isArray(token.tokens)) {
      annotateMarkedTokenLines(token.tokens, token._lineStart);
    } else if (token.type === 'list' && Array.isArray(token.items)) {
      let itemLine = token._lineStart;
      for (const item of token.items) {
        item._lineStart = itemLine;
        if (Array.isArray(item.tokens)) {
          annotateMarkedTokenLines(item.tokens, item._lineStart);
        }
        itemLine += countNewlines(item.raw);
      }
    }

    line += countNewlines(token.raw);
  }

  return line;
}

function makeScrollAnchorToken(line) {
  const safeLine = Math.max(1, Math.floor(Number(line) || 1));
  const html = '<div class="' + SCROLL_ANCHOR_CLASS + '" data-source-line="' + safeLine + '" aria-hidden="true"></div>';
  return {
    type: 'html',
    raw: html,
    text: html,
    block: true,
    pre: false,
  };
}

function isAnchorHtmlToken(token) {
  if (!token || token.type !== 'html') return false;
  const text = String(token.text || token.raw || '');
  return text.includes(SCROLL_ANCHOR_CLASS);
}

function injectMarkedScrollAnchors(tokens) {
  if (!Array.isArray(tokens)) return tokens;
  const out = [];

  for (const token of tokens) {
    if (token.type === 'space') {
      const startLine = Math.max(1, Math.floor(Number(token._lineStart) || 1));
      const endLine = startLine + Math.max(0, countNewlines(token.raw));
      // Blank lines have no rendered counterpart. Add two zero-height anchors so
      // scroll mapping stays flat across the blank range instead of drifting.
      out.push(makeScrollAnchorToken(startLine));
      if (endLine !== startLine) out.push(makeScrollAnchorToken(endLine));
      out.push(token);
      continue;
    }

    if (!isAnchorHtmlToken(token)) {
      out.push(makeScrollAnchorToken(token._lineStart));
    }

    if (token.type === 'blockquote' && Array.isArray(token.tokens)) {
      token.tokens = injectMarkedScrollAnchors(token.tokens);
    } else if (token.type === 'list' && Array.isArray(token.items)) {
      token.items = token.items.map(item => {
        if (Array.isArray(item.tokens)) {
          const itemTokens = injectMarkedScrollAnchors(item.tokens);
          item.tokens = [makeScrollAnchorToken(item._lineStart)].concat(itemTokens);
        }
        return item;
      });
    }

    out.push(token);
  }

  return out;
}

function parseMarkedTokens(tokens) {
  if (typeof marked.parser === 'function') return marked.parser(tokens);
  if (marked.Parser && typeof marked.Parser.parse === 'function') return marked.Parser.parse(tokens);
  return marked.parse(tokens);
}

function parseMarkdownWithScrollAnchors(src) {
  try {
    const tokens = marked.lexer(src);
    annotateMarkedTokenLines(tokens, 1);
    const tokensWithAnchors = injectMarkedScrollAnchors(tokens);
    return parseMarkedTokens(tokensWithAnchors);
  } catch (e) {
    return marked.parse(src);
  }
}

function renderMarkdownKatex(src, container, opts = {}) {
  if (!src || !src.trim()) {
    container.innerHTML = '<span class="empty-hint">暂无内容</span>';
    return;
  }
  const tokens = [];
  const placeholder = src.replace(_mathRe, (m) => {
    tokens.push(m);
    return '@@MATH' + (tokens.length - 1) + '@@';
  });

  let html = opts.withScrollAnchors ? parseMarkdownWithScrollAnchors(placeholder) : marked.parse(placeholder);

  html = html.replace(/@@MATH(\d+)@@/g, (_, i) => {
    const raw = tokens[+i];
    let tex, display;
    if (raw.startsWith('$$')) {
      tex = raw.slice(2, -2);
      display = true;
    } else if (raw.startsWith('\\[')) {
      tex = raw.slice(2, -2);
      display = true;
    } else if (raw.startsWith('\\(')) {
      tex = raw.slice(2, -2);
      display = false;
    } else {
      tex = raw.slice(1, -1);
      display = false;
    }
    try {
      return katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch(e) {
      return '<span style="color:#e53e3e;">' + escapeHtml(raw) + '</span>';
    }
  });

  container.innerHTML = html;
}

let isSyncingEditorPreviewScroll = false;
let isDraggingEditorResizer = false;

function getElementScrollOffset(container, el) {
  const cRect = container.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();
  return (eRect.top - cRect.top) + container.scrollTop;
}

function getPreviewScrollAnchors(container) {
  return Array.from(container.querySelectorAll('.' + SCROLL_ANCHOR_CLASS + '[data-source-line]'))
    .map(el => ({
      el,
      line: Math.max(1, parseFloat(el.dataset.sourceLine) || 1),
      top: getElementScrollOffset(container, el),
    }))
    .sort((a, b) => (a.line - b.line) || (a.top - b.top));
}

function getTextareaLineHeightPx(ta) {
  const lh = parseFloat(getComputedStyle(ta).lineHeight);
  return Number.isFinite(lh) && lh > 0 ? lh : 24;
}

function mapLineToPreviewScrollTop(line, preview, anchors) {
  if (!anchors.length) return 0;
  const maxScroll = Math.max(0, preview.scrollHeight - preview.clientHeight);
  let prev = null;
  let next = null;

  for (const anchor of anchors) {
    if (anchor.line <= line) prev = anchor;
    if (anchor.line > line) { next = anchor; break; }
  }

  let target = 0;
  if (!prev) {
    target = 0;
  } else if (!next || next.line <= prev.line) {
    target = prev.top;
  } else {
    const t = (line - prev.line) / (next.line - prev.line);
    target = prev.top + (next.top - prev.top) * Math.max(0, Math.min(1, t));
  }
  return Math.max(0, Math.min(maxScroll, target));
}

function mapPreviewScrollTopToLine(scrollTop, anchors) {
  if (!anchors.length) return 1;
  let prev = null;
  let next = null;

  for (const anchor of anchors) {
    if (anchor.top <= scrollTop) prev = anchor;
    if (anchor.top > scrollTop) { next = anchor; break; }
  }

  if (!prev) return 1;
  if (!next || next.top <= prev.top) return prev.line;

  const t = (scrollTop - prev.top) / (next.top - prev.top);
  return prev.line + (next.line - prev.line) * Math.max(0, Math.min(1, t));
}

function syncScrollByRatio(sourceEl, targetEl) {
  if (!sourceEl || !targetEl || isSyncingEditorPreviewScroll) return;
  const sourceMax = Math.max(0, sourceEl.scrollHeight - sourceEl.clientHeight);
  const targetMax = Math.max(0, targetEl.scrollHeight - targetEl.clientHeight);

  isSyncingEditorPreviewScroll = true;
  targetEl.scrollTop = (sourceMax > 0 && targetMax > 0)
    ? (sourceEl.scrollTop / sourceMax) * targetMax
    : 0;
  requestAnimationFrame(() => { isSyncingEditorPreviewScroll = false; });
}

function syncPreviewScrollFromEditor() {
  const editor = $('note-editor-md');
  const preview = $('note-preview');
  if (isSyncingEditorPreviewScroll) return;

  const anchors = getPreviewScrollAnchors(preview);
  if (!anchors.length) {
    syncScrollByRatio(editor, preview);
    return;
  }

  const line = 1 + (editor.scrollTop / getTextareaLineHeightPx(editor));
  isSyncingEditorPreviewScroll = true;
  preview.scrollTop = mapLineToPreviewScrollTop(line, preview, anchors);
  requestAnimationFrame(() => { isSyncingEditorPreviewScroll = false; });
}

function syncEditorScrollFromPreview() {
  const editor = $('note-editor-md');
  const preview = $('note-preview');
  if (isSyncingEditorPreviewScroll) return;

  const anchors = getPreviewScrollAnchors(preview);
  if (!anchors.length) {
    syncScrollByRatio(preview, editor);
    return;
  }

  const line = mapPreviewScrollTopToLine(preview.scrollTop, anchors);
  const lineHeight = getTextareaLineHeightPx(editor);
  const maxScroll = Math.max(0, editor.scrollHeight - editor.clientHeight);
  const target = Math.max(0, Math.min(maxScroll, (line - 1) * lineHeight));

  isSyncingEditorPreviewScroll = true;
  editor.scrollTop = target;
  requestAnimationFrame(() => { isSyncingEditorPreviewScroll = false; });
}

function resetEditorPreviewScroll() {
  $('note-editor-md').scrollTop = 0;
  $('note-preview').scrollTop = 0;
}

function setEditorSplitLeftWidth(px) {
  const split = $('editor-split');
  if (!split) return;
  const rect = split.getBoundingClientRect();
  const handleWidth = 10;
  const minPane = 220;
  const maxLeft = Math.max(minPane, rect.width - handleWidth - minPane);
  const left = Math.max(minPane, Math.min(px, maxLeft));
  split.style.setProperty('--editor-left-width', left + 'px');
}

function renderTitlePreview(src) {
  const container = $('note-title-preview');
  if (!src || !src.trim()) {
    container.innerHTML = '<span class="empty-hint">标题实时预览</span>';
    return;
  }
  container.textContent = src;
  renderMathInElement(container, KATEX_OPTS);
}

/* ════════════════════════════════════════════════════════════════════════
   Floating KaTeX Preview
   ════════════════════════════════════════════════════════════════════════ */
const fp = $('float-preview');
const fpBody = $('fp-body');
let fpTimeout = null;

function placeFP(el) {
  const r = el.getBoundingClientRect();
  let top = r.bottom + 8;
  let left = r.left;
  if (top + 280 > window.innerHeight) top = r.top - 280;
  if (left + 420 > window.innerWidth) left = window.innerWidth - 430;
  if (left < 8) left = 8;
  fp.style.top = top + 'px';
  fp.style.left = left + 'px';
}

function showFP(el) {
  clearTimeout(fpTimeout);
  const text = el.value || '';
  if (!text.trim()) { fp.style.display = 'none'; return; }
  if (el.id === 'note-editor-md') {
    renderMarkdownKatex(text, fpBody);
  } else {
    fpBody.textContent = text;
    renderMathInElement(fpBody, KATEX_OPTS);
  }
  placeFP(el);
  fp.style.display = '';
}

function hideFP() {
  fpTimeout = setTimeout(() => { fp.style.display = 'none'; }, 220);
}

/* ════════════════════════════════════════════════════════════════════════
   Data Loading
   ════════════════════════════════════════════════════════════════════════ */
async function loadAllData() {
  await Promise.all([loadTopics(), loadTags(), loadNotes()]);
}

async function loadTopics() {
  try {
    const res = await apiFetch('/api/topics');
    if (!res.ok) return;
    allTopics = await res.json();
    fillTopicSelectors();
  } catch(e) {}
}

async function loadTags() {
  try {
    const res = await apiFetch('/api/tags');
    if (!res.ok) return;
    allTags = await res.json();
    fillTagFilter();
  } catch(e) {}
}

async function loadNotes() {
  try {
    const topic = $('filter-topic').value;
    const tag = $('filter-tag').value;
    const sort = $('filter-sort').value;
    const params = new URLSearchParams();
    if (topic) params.set('topic', topic);
    if (tag) params.set('tag', tag);
    if (sort) params.set('sort', sort);

    const res = await apiFetch('/api/notes?' + params);
    if (!res.ok) return;
    allNotes = await res.json();
    renderNoteList();
  } catch(e) {}
}

/* ════════════════════════════════════════════════════════════════════════
   Selectors
   ════════════════════════════════════════════════════════════════════════ */
function fillTopicSelectors() {
  // Filter
  const fSel = $('filter-topic');
  const fVal = fSel.value;
  fSel.innerHTML = '<option value="">所有主题</option>';
  allTopics.forEach(t => {
    fSel.innerHTML += '<option value="' + escapeHtml(t.name) + '">' + escapeHtml(formatTopicLabel(t.name)) + '</option>';
  });
  fSel.value = fVal;

  // Form
  renderTopicFormSelector();
}

function fillTagFilter() {
  const sel = $('filter-tag');
  const val = sel.value;
  sel.innerHTML = '<option value="">所有标签</option>';
  allTags.forEach(t => {
    sel.innerHTML += '<option value="' + escapeHtml(t.name) + '">' + escapeHtml(t.name) + '</option>';
  });
  sel.value = val;
}

/* ════════════════════════════════════════════════════════════════════════
   Note List Rendering
   ════════════════════════════════════════════════════════════════════════ */
function renderStars(priority) {
  if (!priority) return '';
  let h = '<span class="stars-display">';
  for (let i = 1; i <= 5; i++) {
    h += i <= priority ? '★' : '<span class="empty-star">☆</span>';
  }
  h += '</span>';
  return h;
}

function renderNoteList() {
  const container = $('note-list');
  if (allNotes.length === 0) {
    container.innerHTML = '<div class="empty-hint">暂无笔记，点击"添加笔记"开始记录</div>';
    return;
  }

  container.innerHTML = allNotes.map(note => {
    const tagsHtml = (note.tags || []).map(t =>
      '<span class="badge-tag">' + escapeHtml(t) + '</span>'
    ).join('');

    return '<div class="note-card" data-id="' + note.id + '">' +
      '<div class="note-card-title" data-katex>' + escapeHtml(note.title) + '</div>' +
      '<div class="note-card-meta">' +
        '<span class="badge-topic">' + escapeHtml(formatTopicLabel(note.topic)) + '</span>' +
        tagsHtml +
        renderStars(note.priority) +
        '<span>创建: ' + formatTime(note.created_at) + '</span>' +
        '<span>修改: ' + formatTime(note.updated_at) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  // Render KaTeX in titles
  container.querySelectorAll('[data-katex]').forEach(el => {
    renderMathInElement(el, KATEX_OPTS);
  });

  // Click handlers
  container.querySelectorAll('.note-card').forEach(card => {
    card.addEventListener('click', () => openNoteDetail(card.dataset.id));
  });
}

/* ════════════════════════════════════════════════════════════════════════
   Tag Multi-Select Component
   ════════════════════════════════════════════════════════════════════════ */
function renderTagChips() {
  const container = $('tag-selector-input');
  // Remove existing chips
  container.querySelectorAll('.tag-chip').forEach(c => c.remove());
  const input = $('tag-input');
  // Insert chips before input
  selectedTags.forEach(name => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = escapeHtml(name) + ' <span class="tag-chip-remove" data-tag="' + escapeHtml(name) + '">×</span>';
    container.insertBefore(chip, input);
  });
}

function updateTagDropdown() {
  const dd = $('tag-dropdown');
  const query = $('tag-input').value.trim().toLowerCase();
  const available = allTags.filter(t => !selectedTags.includes(t.name));
  const filtered = query
    ? available.filter(t => t.name.toLowerCase().includes(query))
    : available;

  let html = '';
  filtered.forEach(t => {
    html += '<div class="tag-option" data-tag-name="' + escapeHtml(t.name) + '">' + escapeHtml(t.name) + '</div>';
  });

  // Show "add new" option if query doesn't match existing
  if (query && !allTags.some(t => t.name.toLowerCase() === query) && !selectedTags.includes(query)) {
    html += '<div class="tag-option add-new" data-new-tag="' + escapeHtml(query) + '">+ 添加 "' + escapeHtml(query) + '"</div>';
  }

  dd.innerHTML = html;
  dd.classList.toggle('open', html.length > 0);
}

function selectTag(name) {
  if (!selectedTags.includes(name)) {
    selectedTags.push(name);
  }
  $('tag-input').value = '';
  renderTagChips();
  $('tag-dropdown').classList.remove('open');
}

function removeTag(name) {
  selectedTags = selectedTags.filter(t => t !== name);
  renderTagChips();
}

async function addAndSelectTag(name) {
  try {
    await apiFetch('/api/tags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    await loadTags();
  } catch(e) {}
  selectTag(name);
}

// Event delegation for tag selector
$('tag-selector-input').addEventListener('click', (e) => {
  if (e.target.classList.contains('tag-chip-remove')) {
    removeTag(e.target.dataset.tag);
    return;
  }
  $('tag-input').focus();
});

$('tag-input').addEventListener('focus', () => {
  $('tag-selector-input').classList.add('focused');
  updateTagDropdown();
});

$('tag-input').addEventListener('blur', () => {
  $('tag-selector-input').classList.remove('focused');
  // Delay to allow click on dropdown
  setTimeout(() => { $('tag-dropdown').classList.remove('open'); }, 200);
});

$('tag-input').addEventListener('input', updateTagDropdown);

$('tag-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const query = $('tag-input').value.trim();
    if (!query) return;
    // If matches existing tag, select it
    const match = allTags.find(t => t.name.toLowerCase() === query.toLowerCase());
    if (match && !selectedTags.includes(match.name)) {
      selectTag(match.name);
    } else if (!match) {
      addAndSelectTag(query);
    }
  }
  if (e.key === 'Backspace' && !$('tag-input').value && selectedTags.length > 0) {
    removeTag(selectedTags[selectedTags.length - 1]);
  }
});

$('tag-dropdown').addEventListener('mousedown', (e) => {
  e.preventDefault(); // Prevent blur
  const opt = e.target.closest('.tag-option');
  if (!opt) return;
  if (opt.dataset.tagName) {
    selectTag(opt.dataset.tagName);
  } else if (opt.dataset.newTag) {
    addAndSelectTag(opt.dataset.newTag);
  }
});

/* ════════════════════════════════════════════════════════════════════════
   Star Rating
   ════════════════════════════════════════════════════════════════════════ */
function updateStarDisplay() {
  document.querySelectorAll('#priority-stars .star-btn').forEach(btn => {
    btn.classList.toggle('filled', parseInt(btn.dataset.val) <= currentPriority);
  });
}

$('priority-stars').addEventListener('click', (e) => {
  const btn = e.target.closest('.star-btn');
  if (!btn) return;
  const val = parseInt(btn.dataset.val);
  currentPriority = (currentPriority === val) ? 0 : val;
  updateStarDisplay();
});

/* ════════════════════════════════════════════════════════════════════════
   Note Form
   ════════════════════════════════════════════════════════════════════════ */
function openCreateForm() {
  editingNoteId = null;
  $('form-title-label').textContent = '添加笔记';
  $('note-title').value = '';
  renderTitlePreview('');
  resetTopicFormState();
  setNoteEditorValue('');
  resetEditorPreviewScroll();
  selectedTags = [];
  currentPriority = 0;
  updateStarDisplay();
  renderTagChips();
  showView('form');
}

async function openEditForm(noteId) {
  try {
    const res = await apiFetch('/api/notes/' + noteId);
    if (!res.ok) return;
    const note = await res.json();

    editingNoteId = noteId;
    $('form-title-label').textContent = '编辑笔记';
    $('note-title').value = note.title;
    renderTitlePreview(note.title || '');

    setTopicFormByRawTopic(note.topic || '');

    setNoteEditorValue(note.content || '');
    selectedTags = note.tags || [];
    currentPriority = note.priority || 0;
    updateStarDisplay();
    renderTagChips();
    resetEditorPreviewScroll();
    showView('form');
  } catch(e) {}
}

async function saveNote(options = {}) {
  const navigateAfterSave = !!options.navigateAfterSave;
  const title = $('note-title').value.trim();
  const topic = getTopicValueFromForm();

  if (!topic) {
    const needNewName = topicFormState.pendingNewDepth != null;
    showMsg('form-msg', needNewName ? '请输入新主题名称' : '请选择或创建主题', 'err');
    return;
  }

  const body = {
    title,
    topic,
    content: getNoteEditorValue(),
    priority: currentPriority,
    tags: selectedTags,
  };

  const url = editingNoteId ? '/api/notes/' + editingNoteId : '/api/notes';
  const method = editingNoteId ? 'PUT' : 'POST';

  try {
    const res = await apiFetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const data = await res.json();

    if (!res.ok) {
      showMsg('form-msg', data.error || '保存失败', 'err');
      return;
    }

    const savedNote = data.note || null;
    const savedNoteId = (savedNote && savedNote.id) ? savedNote.id : editingNoteId;
    if (!editingNoteId && savedNoteId) {
      editingNoteId = savedNoteId;
      $('form-title-label').textContent = '编辑笔记';
    }

    showMsg('form-msg', '保存成功！', 'ok');
    await loadAllData();

    if (!navigateAfterSave) {
      return;
    }

    if (savedNoteId) {
      setTimeout(() => openNoteDetail(savedNoteId), 300);
    } else {
      setTimeout(() => showView('list'), 300);
    }
  } catch(e) {
    showMsg('form-msg', '网络错误', 'err');
  }
}

/* ════════════════════════════════════════════════════════════════════════
   Note Detail
   ════════════════════════════════════════════════════════════════════════ */
async function openNoteDetail(noteId) {
  try {
    const res = await apiFetch('/api/notes/' + noteId);
    if (!res.ok) return;
    const note = await res.json();
    viewingNoteId = noteId;

    // Title with KaTeX
    const titleEl = $('detail-title');
    titleEl.textContent = note.title;
    renderMathInElement(titleEl, KATEX_OPTS);

    // Meta
    const tagsHtml = (note.tags || []).map(t =>
      '<span class="badge-tag">' + escapeHtml(t) + '</span>'
    ).join('');

    $('detail-meta').innerHTML =
      '<span class="badge-topic">' + escapeHtml(formatTopicLabel(note.topic)) + '</span>' +
      tagsHtml +
      renderStars(note.priority) +
      '<span>创建: ' + formatTime(note.created_at) + '</span>' +
      '<span>修改: ' + formatTime(note.updated_at) + '</span>';

    // Body
    renderMarkdownKatex(note.content || '', $('detail-body'));

    // Clear input areas
    $('comment-input-area').innerHTML = '';
    $('question-input-area').innerHTML = '';

    // Load comments & questions
    loadComments(noteId);
    loadQuestions(noteId);

    showView('detail');
  } catch(e) {}
}

/* ════════════════════════════════════════════════════════════════════════
   Image Upload
   ════════════════════════════════════════════════════════════════════════ */
async function uploadAndInsertImage(file) {
  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await apiFetch('/api/upload', {
      method: 'POST',
      body: formData,
    });

    if (!res.ok) {
      const data = await res.json();
      alert(data.error || '图片上传失败');
      return;
    }

    const data = await res.json();
    const md = '![image](' + data.url + ')';

    if (insertMarkdownToNoteEditor(md)) {
      return;
    }

    const ta = $('note-editor-md');
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + md + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + md.length;
    focusNoteEditor();

    renderMarkdownKatex(ta.value, $('note-preview'), { withScrollAnchors: true });
    syncPreviewScrollFromEditor();
  } catch(e) {
    alert('图片上传失败');
  }
}

$('btn-upload-img').addEventListener('click', () => {
  $('img-file-input').click();
});

$('img-file-input').addEventListener('change', async function() {
  if (!this.files.length) return;
  await uploadAndInsertImage(this.files[0]);
  this.value = '';
});

$('note-editor-md').addEventListener('paste', async (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const blob = item.getAsFile();
      await uploadAndInsertImage(blob);
      return;
    }
  }
});

const editorResizer = $('editor-resizer');
editorResizer.addEventListener('pointerdown', (e) => {
  if (window.matchMedia('(max-width: 800px)').matches) return;
  isDraggingEditorResizer = true;
  editorResizer.classList.add('active');
  editorResizer.setPointerCapture?.(e.pointerId);
  e.preventDefault();
});

window.addEventListener('pointermove', (e) => {
  if (!isDraggingEditorResizer) return;
  const split = $('editor-split');
  const rect = split.getBoundingClientRect();
  setEditorSplitLeftWidth(e.clientX - rect.left - 5);
});

function stopEditorResizerDrag(e) {
  if (!isDraggingEditorResizer) return;
  isDraggingEditorResizer = false;
  editorResizer.classList.remove('active');
  if (e && e.pointerId != null) {
    try { editorResizer.releasePointerCapture?.(e.pointerId); } catch (_) {}
  }
}

window.addEventListener('pointerup', stopEditorResizerDrag);
window.addEventListener('pointercancel', stopEditorResizerDrag);

editorResizer.addEventListener('keydown', (e) => {
  if (window.matchMedia('(max-width: 800px)').matches) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const split = $('editor-split');
  const leftCol = split.querySelector('.editor-col');
  const currentLeft = leftCol ? leftCol.getBoundingClientRect().width : ((split.getBoundingClientRect().width - 10) / 2);
  const delta = e.key === 'ArrowLeft' ? -24 : 24;
  setEditorSplitLeftWidth(currentLeft + delta);
  e.preventDefault();
});

// --- Shared: create an input box with live KaTeX preview ---
function createCQInputBox(opts) {
  // opts: { container, placeholder, submitLabel, onSubmit, onCancel, isReply }
  const box = document.createElement('div');
  box.className = 'cq-input-box' + (opts.isReply ? ' is-reply' : '');

  const ta = document.createElement('textarea');
  ta.placeholder = opts.placeholder || '输入内容，支持 $LaTeX$ 公式...';
  box.appendChild(ta);

  const preview = document.createElement('div');
  preview.className = 'cq-input-preview';
  preview.innerHTML = '<span class="empty-hint">实时预览</span>';
  box.appendChild(preview);

  const actions = document.createElement('div');
  actions.className = 'cq-input-actions';

  const btnSubmit = document.createElement('button');
  btnSubmit.className = 'btn-submit';
  btnSubmit.textContent = opts.submitLabel || '提交';
  actions.appendChild(btnSubmit);

  const btnCancel = document.createElement('button');
  btnCancel.className = 'btn-cancel';
  btnCancel.textContent = '取消';
  actions.appendChild(btnCancel);

  box.appendChild(actions);
  opts.container.appendChild(box);

  // Live preview
  ta.addEventListener('input', () => {
    const text = ta.value.trim();
    if (!text) {
      preview.innerHTML = '<span class="empty-hint">实时预览</span>';
    } else {
      preview.textContent = text;
      renderMathInElement(preview, KATEX_OPTS);
    }
  });

  // Float preview on focus
  ta.addEventListener('focus', () => showFP(ta));
  ta.addEventListener('input', () => showFP(ta));
  ta.addEventListener('blur', hideFP);

  btnSubmit.addEventListener('click', async () => {
    const text = ta.value.trim();
    if (!text) return;
    btnSubmit.disabled = true;
    btnSubmit.textContent = '提交中...';
    await opts.onSubmit(text);
    box.remove();
  });

  btnCancel.addEventListener('click', () => {
    box.remove();
    if (opts.onCancel) opts.onCancel();
  });

  ta.focus();
  return box;
}

// --- Comments ---
async function loadComments(noteId) {
  try {
    const res = await apiFetch('/api/notes/' + noteId + '/comments');
    if (!res.ok) return;
    const comments = await res.json();
    renderComments(comments, noteId);
  } catch(e) {}
}

function renderComments(comments, noteId) {
  const container = $('comment-list');
  // Separate top-level and replies
  const topLevel = comments.filter(c => !c.parent_id);
  const replies = comments.filter(c => c.parent_id);
  const replyMap = {};
  replies.forEach(r => {
    if (!replyMap[r.parent_id]) replyMap[r.parent_id] = [];
    replyMap[r.parent_id].push(r);
  });

  let html = '';
  topLevel.forEach(c => {
    html += renderCommentItem(c, false);
    (replyMap[c.id] || []).forEach(r => {
      html += renderCommentItem(r, true);
    });
  });

  container.innerHTML = html || '';

  // KaTeX in comment bodies
  container.querySelectorAll('.cq-item-body').forEach(el => {
    renderMathInElement(el, KATEX_OPTS);
  });

  // Reply buttons
  container.querySelectorAll('.btn-reply-comment').forEach(btn => {
    btn.addEventListener('click', () => {
      const parentId = btn.dataset.id;
      // Remove any existing reply boxes
      container.querySelectorAll('.cq-input-box').forEach(b => b.remove());
      const item = btn.closest('.cq-item');
      const wrapper = document.createElement('div');
      item.after(wrapper);
      createCQInputBox({
        container: wrapper,
        placeholder: '回复评论，支持 $LaTeX$ 公式...',
        submitLabel: '提交回复',
        isReply: true,
        onSubmit: async (text) => {
          await apiFetch('/api/notes/' + noteId + '/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: text, parent_id: parentId }),
          });
          wrapper.remove();
          loadComments(noteId);
        },
        onCancel: () => wrapper.remove(),
      });
    });
  });

  container.querySelectorAll('.btn-delete-comment').forEach(btn => {
    btn.addEventListener('click', async () => {
      const isReply = btn.dataset.reply === '1';
      const msg = isReply
        ? '确定要删除这条评论回复吗？'
        : '确定要删除这条评论吗？其回复也会一并删除。';
      if (!confirm(msg)) return;
      try {
        const res = await apiFetch('/api/comments/' + btn.dataset.id, { method: 'DELETE' });
        if (!res.ok) {
          let msg = '删除评论失败';
          try {
            const data = await res.json();
            if (data && data.error) msg = data.error;
          } catch (e) {}
          alert(msg);
          return;
        }
        loadComments(noteId);
      } catch (e) {
        alert('删除评论失败');
      }
    });
  });
}

function renderCommentItem(c, isReply) {
  return '<div class="cq-item' + (isReply ? ' is-reply' : '') + '">' +
    '<div class="cq-item-header">' +
      '<span class="cq-icon">💬</span>' +
      '<span>' + formatTime(c.created_at) + '</span>' +
    '</div>' +
    '<div class="cq-item-body">' + escapeHtml(c.content) + '</div>' +
    '<div class="cq-item-actions">' +
      (isReply ? '' : '<button class="btn-reply-comment" data-id="' + c.id + '">回复</button>') +
      '<button class="btn-delete-comment btn-delete-cq" data-id="' + c.id + '" data-reply="' + (isReply ? '1' : '0') + '">删除</button>' +
    '</div>' +
  '</div>';
}

// --- Questions ---
async function loadQuestions(noteId) {
  try {
    const res = await apiFetch('/api/notes/' + noteId + '/questions');
    if (!res.ok) return;
    const questions = await res.json();
    renderQuestions(questions, noteId);
  } catch(e) {}
}

function renderQuestions(questions, noteId) {
  const container = $('question-list');
  const topLevel = questions.filter(q => !q.parent_id);
  const replies = questions.filter(q => q.parent_id);
  const replyMap = {};
  replies.forEach(r => {
    if (!replyMap[r.parent_id]) replyMap[r.parent_id] = [];
    replyMap[r.parent_id].push(r);
  });

  let html = '';
  topLevel.forEach(q => {
    html += renderQuestionItem(q, false);
    (replyMap[q.id] || []).forEach(r => {
      html += renderQuestionItem(r, true);
    });
  });

  container.innerHTML = html || '';

  // KaTeX
  container.querySelectorAll('.cq-item-body').forEach(el => {
    renderMathInElement(el, KATEX_OPTS);
  });

  // Toggle resolved
  container.querySelectorAll('.btn-toggle-resolved').forEach(btn => {
    btn.addEventListener('click', async () => {
      await apiFetch('/api/questions/' + btn.dataset.id + '/toggle-resolved', { method: 'POST' });
      loadQuestions(noteId);
    });
  });

  // Reply buttons
  container.querySelectorAll('.btn-reply-question').forEach(btn => {
    btn.addEventListener('click', () => {
      const parentId = btn.dataset.id;
      container.querySelectorAll('.cq-input-box').forEach(b => b.remove());
      const item = btn.closest('.cq-item');
      const wrapper = document.createElement('div');
      item.after(wrapper);
      createCQInputBox({
        container: wrapper,
        placeholder: '回复问题，支持 $LaTeX$ 公式...',
        submitLabel: '提交回复',
        isReply: true,
        onSubmit: async (text) => {
          await apiFetch('/api/notes/' + noteId + '/questions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: text, parent_id: parentId }),
          });
          wrapper.remove();
          loadQuestions(noteId);
        },
        onCancel: () => wrapper.remove(),
      });
    });
  });

  container.querySelectorAll('.btn-delete-question').forEach(btn => {
    btn.addEventListener('click', async () => {
      const isReply = btn.dataset.reply === '1';
      const msg = isReply
        ? '确定要删除这条问题回复吗？'
        : '确定要删除这个问题吗？其回复也会一并删除。';
      if (!confirm(msg)) return;
      try {
        const res = await apiFetch('/api/questions/' + btn.dataset.id, { method: 'DELETE' });
        if (!res.ok) {
          let msg = '删除问题失败';
          try {
            const data = await res.json();
            if (data && data.error) msg = data.error;
          } catch (e) {}
          alert(msg);
          return;
        }
        loadQuestions(noteId);
      } catch (e) {
        alert('删除问题失败');
      }
    });
  });
}

function renderQuestionItem(q, isReply) {
  const iconClass = q.resolved ? 'resolved' : 'question';
  const icon = q.resolved ? '✅' : '❓';
  const resolveBtn = (!isReply && !q.resolved)
    ? '<button class="btn-toggle-resolved btn-resolve" data-id="' + q.id + '">已解决</button>'
    : (!isReply && q.resolved)
    ? '<button class="btn-toggle-resolved btn-unresolve" data-id="' + q.id + '">改为未解决</button>'
    : '';

  return '<div class="cq-item' + (isReply ? ' is-reply' : '') + '">' +
    '<div class="cq-item-header">' +
      '<span class="cq-icon ' + iconClass + '">' + icon + '</span>' +
      '<span>' + formatTime(q.created_at) + '</span>' +
      (q.resolved && !isReply ? '<span style="color:#38a169;font-weight:600;">已解决</span>' : '') +
    '</div>' +
    '<div class="cq-item-body">' + escapeHtml(q.content) + '</div>' +
    '<div class="cq-item-actions">' +
      (isReply ? '' : resolveBtn + '<button class="btn-reply-question" data-id="' + q.id + '">回复</button>') +
      '<button class="btn-delete-question btn-delete-cq" data-id="' + q.id + '" data-reply="' + (isReply ? '1' : '0') + '">删除</button>' +
    '</div>' +
  '</div>';
}
